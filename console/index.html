<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FuseBox Console</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%2388c0d0' d='M12 2 3 7v10l9 5 9-5V7l-9-5zm0 2.3L18.6 8 12 11.7 5.4 8 12 4.3zM5 9.7l6 3.4v6.6l-6-3.3V9.7zm14 0v6.7l-6 3.3v-6.6l6-3.4z'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="vendor/xterm.min.css">
<script src="vendor/xterm.min.js"></script>
<script src="vendor/addon-fit.min.js"></script>
</head>
<body>
<header>
  <span class="brand" title="FuseBox — microVM sandbox">
    <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true">
      <path fill="#88c0d0" d="M12 2 3 7v10l9 5 9-5V7l-9-5zm0 2.3L18.6 8 12 11.7 5.4 8 12 4.3zM5 9.7l6 3.4v6.6l-6-3.3V9.7zm14 0v6.7l-6 3.3v-6.6l6-3.4z"/>
    </svg>
    Fuse<b>Box</b>&nbsp;<span style="color:var(--fg-2);font-weight:400;font-size:12px">console</span>
  </span>
  <span id="dot" class="dot"></span>
  <input id="url" type="text" spellcheck="false" value="ws://192.0.2.2:2024"
         title="WebSocket endpoint of the sandbox supervisor">
  <button id="connect">Connect</button>
  <span id="status">disconnected</span>
  <span id="sessions" class="chip" title="active shell sessions">–</span>
  <button id="paneltoggle" title="toggle files panel">&#9636;</button>
</header>

<main>
  <div id="terminal-wrap">
    <div id="terminal"></div>
    <div id="term-overlay"><span><span class="pulse">◉</span> not connected — hit Connect</span></div>
  </div>
  <aside id="files">
    <div class="files-head">
      <span>files</span>
      <button id="refresh" title="refresh listing">&#x21bb;</button>
    </div>
    <select id="filesdir" title="directory">
      <option value="/mnt/user-data/outputs">outputs</option>
      <option value="/mnt/user-data/uploads">uploads</option>
      <option value="/mnt/user-data/tool_results">tool_results</option>
      <option value="/mnt/filestore">filestore (ro)</option>
    </select>
    <ul id="filelist"><li class="empty">connect to browse</li></ul>
    <label id="dropzone">drop files here or click to upload
      <input id="upload" type="file" multiple>
    </label>
  </aside>
</main>

<footer>
  <span>firmware boundary: raw bytes &rarr; WS 2024; JSON stdout chunks + control frames &larr;</span>
  <span id="hint"></span>
</footer>

<div id="toasts"></div>
<script src="app.js"></script>
</body>
</html>
